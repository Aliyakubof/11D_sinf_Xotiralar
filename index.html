<script>
// Animatsiyadan keyin bosh sahifa ochish
function enterSite(){
  document.getElementById('intro-screen').classList.add('hidden');
  showSection('home');
  const mainVideo = document.getElementById('mainVideo');
  mainVideo.play();
}

// Section toggle va navbar active
function showSection(id){
  document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`nav button[onclick="showSection('${id}')"]`).classList.add('active');

  // Rasmlar bo‘limida audio autoplay
  const audio = document.getElementById('imgAudio');
  if(id === 'images'){
    audio.play();
  } else {
    audio.pause();
    audio.currentTime = 0;
  }
}

// Videolar bo‘limi fullscreen tugmalar
const allVideos = Array.from(document.querySelectorAll(".video-fullscreen-container video"));
let currentIndex = 0;

allVideos.forEach((vid, idx)=>{
  const controls = document.createElement("div");
  controls.className = "fullscreen-controls";
  controls.innerHTML = `<button class="prevBtn">⟵</button><button class="nextBtn">⟶</button>`;
  document.body.appendChild(controls);

  const prevBtn = controls.querySelector(".prevBtn");
  const nextBtn = controls.querySelector(".nextBtn");

  function updateControls() {
    if(document.fullscreenElement === vid){
      controls.style.display = "flex";
    } else {
      controls.style.display = "none";
    }
  }

  prevBtn.addEventListener("click", ()=> {
    if(idx>0) allVideos[idx-1].requestFullscreen();
  });

  nextBtn.addEventListener("click", ()=> {
    if(idx<allVideos.length-1) allVideos[idx+1].requestFullscreen();
  });

  vid.addEventListener("fullscreenchange", updateControls);
});
</script>
